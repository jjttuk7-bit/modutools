<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모두도구 · modutools</title>
    <meta name="description" content="사업 계산, QR, 썸네일, PDF 정리, 개인정보 마스킹을 한 곳에서. 서버 저장 없이 브라우저에서 안전하게 처리하는 무료 도구함." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('modutools-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
