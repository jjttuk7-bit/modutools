<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />

    <title>모두의 도구 · 가입 없이 바로 쓰는 무료 실무 도구</title>
    <meta
      name="description"
      content="부가세·프리랜서 3.3% 계산부터 QR 만들기, PDF 정리, 썸네일 디자인, 엑셀 중복 제거까지. 회원가입·결제 없이 브라우저 안에서만 처리하는 무료 도구함."
    />
    <meta name="author" content="모두의 도구" />
    <link rel="canonical" href="https://www.modutools.kr/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="모두의 도구" />
    <meta property="og:title" content="모두의 도구 · 가입 없이 바로 쓰는 무료 실무 도구" />
    <meta
      property="og:description"
      content="부가세·프리랜서 3.3% 계산, QR, PDF 정리, 썸네일, 엑셀 정리까지 25개 무료 도구. 서버 전송 없이 브라우저에서만 처리합니다."
    />
    <meta property="og:url" content="https://www.modutools.kr/" />
    <meta property="og:image" content="https://www.modutools.kr/og-image.png" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="모두의 도구 · 가입 없이 바로 쓰는 무료 실무 도구" />
    <meta
      name="twitter:description"
      content="부가세·프리랜서 3.3% 계산, QR, PDF 정리, 썸네일, 엑셀 정리까지 25개 무료 도구. 서버 전송 없이 브라우저에서만 처리합니다."
    />
    <meta name="twitter:image" content="https://www.modutools.kr/og-image.png" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('modutools-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
